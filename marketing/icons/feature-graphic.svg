<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="500" viewBox="0 0 1024 500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a2e1a"/>
      <stop offset="50%" style="stop-color:#145a32"/>
      <stop offset="100%" style="stop-color:#1a7a42"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1024" height="500" fill="url(#bg)"/>

  <!-- Subtle radial glows -->
  <circle cx="300" cy="250" r="280" fill="rgba(39,174,96,0.08)"/>
  <circle cx="750" cy="250" r="220" fill="rgba(244,208,63,0.04)"/>

  <!-- Mesh nodes - left -->
  <circle cx="70" cy="80" r="5" fill="rgba(169,223,191,0.4)"/>
  <circle cx="150" cy="40" r="4" fill="rgba(169,223,191,0.3)"/>
  <circle cx="40" cy="200" r="6" fill="rgba(169,223,191,0.35)"/>
  <circle cx="130" cy="160" r="4" fill="rgba(169,223,191,0.3)"/>
  <circle cx="90" cy="330" r="5" fill="rgba(169,223,191,0.35)"/>
  <circle cx="170" cy="380" r="4" fill="rgba(169,223,191,0.3)"/>
  <circle cx="190" cy="260" r="5" fill="rgba(169,223,191,0.35)"/>
  <circle cx="60" cy="440" r="4" fill="rgba(169,223,191,0.25)"/>

  <!-- Lines - left -->
  <line x1="70" y1="80" x2="150" y2="40" stroke="rgba(169,223,191,0.15)" stroke-width="1.5"/>
  <line x1="70" y1="80" x2="40" y2="200" stroke="rgba(169,223,191,0.15)" stroke-width="1.5"/>
  <line x1="70" y1="80" x2="130" y2="160" stroke="rgba(169,223,191,0.15)" stroke-width="1.5"/>
  <line x1="40" y1="200" x2="130" y2="160" stroke="rgba(169,223,191,0.12)" stroke-width="1"/>
  <line x1="40" y1="200" x2="90" y2="330" stroke="rgba(169,223,191,0.15)" stroke-width="1.5"/>
  <line x1="90" y1="330" x2="190" y2="260" stroke="rgba(169,223,191,0.15)" stroke-width="1.5"/>
  <line x1="90" y1="330" x2="170" y2="380" stroke="rgba(169,223,191,0.12)" stroke-width="1"/>
  <line x1="190" y1="260" x2="130" y2="160" stroke="rgba(169,223,191,0.12)" stroke-width="1"/>
  <line x1="170" y1="380" x2="60" y2="440" stroke="rgba(169,223,191,0.12)" stroke-width="1"/>

  <!-- Mesh nodes - right -->
  <circle cx="880" cy="70" r="4" fill="rgba(169,223,191,0.3)"/>
  <circle cx="960" cy="160" r="5" fill="rgba(169,223,191,0.35)"/>
  <circle cx="930" cy="300" r="4" fill="rgba(169,223,191,0.3)"/>
  <circle cx="850" cy="390" r="5" fill="rgba(169,223,191,0.35)"/>
  <circle cx="970" cy="400" r="4" fill="rgba(169,223,191,0.25)"/>
  <circle cx="840" cy="120" r="4" fill="rgba(169,223,191,0.25)"/>
  <circle cx="990" cy="60" r="3" fill="rgba(169,223,191,0.2)"/>
  <circle cx="870" cy="460" r="4" fill="rgba(169,223,191,0.25)"/>

  <!-- Lines - right -->
  <line x1="880" y1="70" x2="960" y2="160" stroke="rgba(169,223,191,0.15)" stroke-width="1.5"/>
  <line x1="880" y1="70" x2="840" y2="120" stroke="rgba(169,223,191,0.12)" stroke-width="1"/>
  <line x1="880" y1="70" x2="990" y2="60" stroke="rgba(169,223,191,0.1)" stroke-width="1"/>
  <line x1="960" y1="160" x2="930" y2="300" stroke="rgba(169,223,191,0.15)" stroke-width="1.5"/>
  <line x1="930" y1="300" x2="850" y2="390" stroke="rgba(169,223,191,0.15)" stroke-width="1.5"/>
  <line x1="850" y1="390" x2="970" y2="400" stroke="rgba(169,223,191,0.12)" stroke-width="1"/>
  <line x1="840" y1="120" x2="960" y2="160" stroke="rgba(169,223,191,0.12)" stroke-width="1"/>
  <line x1="850" y1="390" x2="870" y2="460" stroke="rgba(169,223,191,0.1)" stroke-width="1"/>

  <!-- Logo: Conect in white, x in gold -->
  <text x="512" y="165" font-family="Inter, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="80" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="-3">Conect<tspan fill="#f4d03f">x</tspan></text>

  <!-- Tagline -->
  <text x="512" y="235" font-family="Inter, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="26" font-weight="500" fill="rgba(255,255,255,0.85)" text-anchor="middle">No pierdas a tu grupo. Ni en el estadio.</text>

  <!-- Sub-tagline -->
  <text x="512" y="290" font-family="Inter, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="rgba(255,255,255,0.5)" text-anchor="middle">Chat y ubicación via mesh · Sin señal necesaria · Cifrado extremo a extremo</text>

  <!-- Three badges -->
  <rect x="300" y="330" width="120" height="36" rx="18" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
  <text x="360" y="353" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="rgba(255,255,255,0.7)" text-anchor="middle">Bluetooth</text>

  <rect x="452" y="330" width="120" height="36" rx="18" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
  <text x="512" y="353" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="rgba(255,255,255,0.7)" text-anchor="middle">WiFi Mesh</text>

  <rect x="604" y="330" width="120" height="36" rx="18" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
  <text x="664" y="353" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="rgba(255,255,255,0.7)" text-anchor="middle">100% Offline</text>

  <!-- World Cup 2026 note -->
  <text x="512" y="420" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="rgba(244,208,63,0.6)" text-anchor="middle">Mundial 2026 · México</text>
</svg>