<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a2e1a"/>
      <stop offset="50%" style="stop-color:#145a32"/>
      <stop offset="100%" style="stop-color:#1a7a42"/>
    </linearGradient>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f4d03f"/>
      <stop offset="100%" style="stop-color:#d4ac0d"/>
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect width="512" height="512" rx="108" ry="108" fill="url(#bg)"/>

  <!-- Subtle radial glow -->
  <circle cx="256" cy="256" r="200" fill="rgba(39,174,96,0.15)"/>

  <!-- Mesh network nodes - outer ring -->
  <circle cx="256" cy="108" r="18" fill="rgba(169,223,191,0.6)"/>
  <circle cx="384" cy="180" r="18" fill="rgba(169,223,191,0.6)"/>
  <circle cx="404" cy="320" r="18" fill="rgba(169,223,191,0.6)"/>
  <circle cx="308" cy="410" r="18" fill="rgba(169,223,191,0.6)"/>
  <circle cx="172" cy="390" r="18" fill="rgba(169,223,191,0.6)"/>
  <circle cx="118" cy="260" r="18" fill="rgba(169,223,191,0.6)"/>

  <!-- Mesh connection lines - outer to center -->
  <line x1="256" y1="108" x2="256" y2="220" stroke="rgba(169,223,191,0.3)" stroke-width="2.5"/>
  <line x1="384" y1="180" x2="300" y2="230" stroke="rgba(169,223,191,0.3)" stroke-width="2.5"/>
  <line x1="404" y1="320" x2="310" y2="290" stroke="rgba(169,223,191,0.3)" stroke-width="2.5"/>
  <line x1="308" y1="410" x2="280" y2="310" stroke="rgba(169,223,191,0.3)" stroke-width="2.5"/>
  <line x1="172" y1="390" x2="230" y2="300" stroke="rgba(169,223,191,0.3)" stroke-width="2.5"/>
  <line x1="118" y1="260" x2="210" y2="260" stroke="rgba(169,223,191,0.3)" stroke-width="2.5"/>

  <!-- Mesh connection lines - between outer nodes -->
  <line x1="256" y1="108" x2="384" y2="180" stroke="rgba(169,223,191,0.15)" stroke-width="1.5"/>
  <line x1="384" y1="180" x2="404" y2="320" stroke="rgba(169,223,191,0.15)" stroke-width="1.5"/>
  <line x1="404" y1="320" x2="308" y2="410" stroke="rgba(169,223,191,0.15)" stroke-width="1.5"/>
  <line x1="308" y1="410" x2="172" y2="390" stroke="rgba(169,223,191,0.15)" stroke-width="1.5"/>
  <line x1="172" y1="390" x2="118" y2="260" stroke="rgba(169,223,191,0.15)" stroke-width="1.5"/>
  <line x1="118" y1="260" x2="256" y2="108" stroke="rgba(169,223,191,0.15)" stroke-width="1.5"/>

  <!-- Central bold X in gold -->
  <g transform="translate(256,260)">
    <!-- X strokes -->
    <line x1="-62" y1="-62" x2="62" y2="62" stroke="url(#gold-grad)" stroke-width="28" stroke-linecap="round"/>
    <line x1="62" y1="-62" x2="-62" y2="62" stroke="url(#gold-grad)" stroke-width="28" stroke-linecap="round"/>
  </g>

  <!-- Gold glow behind X -->
  <circle cx="256" cy="260" r="50" fill="rgba(244,208,63,0.08)"/>

  <!-- Small bright dots at X endpoints for mesh effect -->
  <circle cx="194" cy="198" r="8" fill="#f4d03f" opacity="0.9"/>
  <circle cx="318" cy="198" r="8" fill="#f4d03f" opacity="0.9"/>
  <circle cx="194" cy="322" r="8" fill="#f4d03f" opacity="0.9"/>
  <circle cx="318" cy="322" r="8" fill="#f4d03f" opacity="0.9"/>
</svg>